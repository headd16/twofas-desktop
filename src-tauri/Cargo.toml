[package]
name = "twofas-desktop"
version = "0.1.0"
edition = "2021"
description = "Independent local Windows authenticator"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
pbkdf2 = "0.12"
arboard = "3"
rfd = "0.15"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
